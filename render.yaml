# Render Blueprint: in Render choose New > Blueprint and pick this repository.
services:
  - type: web
    name: pairmundo
    runtime: node
    rootDir: server
    region: frankfurt
    # A paid plan is needed for the disk below, which keeps the database and photos between deploys.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/programs
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/pairmundo.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional photo storage (Cloudflare R2 or any S3-compatible bucket). Leave empty to keep photos on the disk.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      # Optional automatic photo check with Claude. Leave empty to keep it off.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional nightly database backups to a second, private bucket (uses the S3_* endpoint and keys above).
      - key: BACKUP_BUCKET
        sync: false
      # Optional ID check (Stripe Identity). Leave empty to keep it switched off.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
      - key: PUBLIC_URL
        value: https://pairmundo.com
